name: DIGIT-Install workflow for UAT
on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  DIGIT-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ vars.CLUSTER_NAME_UAT }}

      - name: Install kubectl in runner
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest' # default is latest stable

      - name: Install sops
        run: |
          sudo apt update
          wget https://github.com/mozilla/sops/releases/download/v3.7.1/sops-v3.7.1.linux
          chmod +x sops-v3.7.1.linux
          sudo mv sops-v3.7.1.linux /usr/local/bin/sops

      - name: sops decryption
        run: |
          aws sts get-caller-identity
          sops -i -d --kms ${{ secrets.PUBLIC_KMS_KEY_UAT }} ./deploy-as-code/charts/environments/livelihood-uat-secrets.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.9.0' # Specify the version of Helm

      - name: Install helm plugins
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version v3.9.11
          helm plugin list

      - name: Install Helmfile
        run: |
          wget https://github.com/helmfile/helmfile/releases/download/v0.150.0/helmfile_0.150.0_linux_amd64.tar.gz
          tar -xzf helmfile_0.150.0_linux_amd64.tar.gz
          sudo mv helmfile /usr/local/bin/helmfile
          sudo chmod +x /usr/local/bin/helmfile
          helmfile --version

      - name: digit deployment
        env:
          HELMFILE_ENV: "livelihood-uat"
        run: helmfile -f ./deploy-as-code/digit-helmfile.yaml apply --include-needs=true

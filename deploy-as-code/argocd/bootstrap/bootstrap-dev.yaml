apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-platform-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Selco-Foundation/DIGIT-DevOps.git
    targetRevision: main
    path: deploy-as-code/argocd/platform

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://AB343EA957DD5FCE7A2CA27E91114AC5.gr7.ap-south-1.eks.amazonaws.com
    namespace: core-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

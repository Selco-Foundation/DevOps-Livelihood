apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-platform-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Selco-Foundation/DevOps-Livelihood.git
    targetRevision: develop
    path: deploy-as-code/argocd/platform

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: core

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
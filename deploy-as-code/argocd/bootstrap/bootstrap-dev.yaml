apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-platform-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Selco-Foundation/DevOps-Livelihood.git
    targetRevision: Prod
    path: deploy-as-code/argocd/platform

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    # This Application creates the dev AppProject + ApplicationSet, which are
    # ArgoCD CRDs that must live in the cluster running ArgoCD itself (prod).
    # The child apps rendered by that ApplicationSet target the dev EKS
    # cluster instead, via the remote cluster registered in
    # ../controller-cross-cluster-values.yaml.
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

name: livelihood-devops-prod
namespace: argocd

project:
  description: Restrict ArgoCD access to core namespace
  sourceRepos:
    - https://github.com/Selco-Foundation/DevOps-Livelihood.git
  destination:
    # TODO: confirm this ArgoCD instance actually runs in-cluster on prod
    # (matching Livelihood's hub pattern). If it runs elsewhere, swap this
    # for a `name:` referencing a registered remote cluster instead.
    server: https://kubernetes.default.svc
    namespace: core
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist: []

applicationset:
  repoURL: https://github.com/Selco-Foundation/DevOps-Livelihood.git
  revision: Prod
  chartRoot: deploy-as-code/charts/core-services/*
  # Renders each core-services sub-chart via the sops-helm CMP sidecar
  # (see ../repo-server-cmp/values.yaml) so selco-prod-secrets.yaml
  # (SOPS-encrypted) is decrypted before `helm template` runs.
  cmpPlugin: sops-helm
  valueFiles:
    - ../../environments/livelihood-prod.yaml
    - ../../environments/livelihood-prod-tags.yaml
    - ../../environments/livelihood-prod-secrets.yaml
  # Prod requires a manual sync in ArgoCD instead of auto-applying every
  # Git change; syncOptions still match the chart default.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Validate=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

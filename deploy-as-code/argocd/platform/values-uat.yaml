name: livelihood-devops-uat
namespace: argocd

project:
  description: Restrict ArgoCD access to core namespace on the uat cluster
  sourceRepos:
    - https://github.com/Selco-Foundation/DevOps-Livelihood.git
  destinations:
    # UAT EKS runs in its own VPC, separate from the prod cluster that hosts
    # this ArgoCD instance, so it's addressed as a registered remote cluster
    # (name must match a key under configs.clusterCredentials in
    # ../controller-cross-cluster-values.yaml) rather than a `server:` URL.
    - name: livelihood-uat
      namespace: core
    - name: livelihood-uat
      namespace: backbone
    - name: livelihood-uat
      namespace: monitoring
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist: []

applicationset:
  repoURL: https://github.com/Selco-Foundation/DevOps-Livelihood.git
  revision: uat
  chartRoot: deploy-as-code/charts/core-services/*
  destination:
    name: livelihood-uat
    namespace: core
  # Renders each core-services sub-chart via the sops-helm CMP sidecar
  # (see ../repo-server-cmp/values.yaml) so livelihood-uat-secrets.yaml
  # (SOPS-encrypted) is decrypted before `helm template` runs.
  cmpPlugin: sops-helm
  valueFiles:
    - ../../environments/livelihood-uat.yaml
    - ../../environments/livelihood-uat-tags.yaml
    - ../../environments/livelihood-uat-secrets.yaml
  # UAT's `core` namespace currently holds ~34 Helm releases deployed by helmfile.
  # Omitting `automated:` makes ArgoCD adopt them read-only: every app shows
  # OutOfSync until it is synced by hand, so each diff can be reviewed before
  # ArgoCD takes over. Flip to automated (prune + selfHeal) once the whole set
  # syncs clean. syncOptions match the chart default.
  syncPolicy:
    syncOptions:
      - Validate=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

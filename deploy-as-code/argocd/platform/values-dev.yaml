name: livelihood-devops-dev
namespace: argocd

project:
  description: Restrict ArgoCD access to core namespace on the dev cluster
  sourceRepos:
    - https://github.com/Selco-Foundation/DevOps-Livelihood.git
  destination:
    # Dev EKS runs in its own VPC, separate from the prod cluster that hosts
    # this ArgoCD instance, so it's addressed as a registered remote cluster
    # (name must match a key under configs.clusterCredentials in
    # ../controller-cross-cluster-values.yaml) rather than a `server:` URL.
    name: livelihood-dev
    namespace: core
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist: []

applicationset:
  repoURL: https://github.com/Selco-Foundation/DevOps-Livelihood.git
  revision: develop
  chartRoot: deploy-as-code/charts/core-services/*
  # Renders each core-services sub-chart via the sops-helm CMP sidecar
  # (see ../repo-server-cmp/values.yaml) so livelihood-dev-secrets.yaml
  # (SOPS-encrypted) is decrypted before `helm template` runs.
  cmpPlugin: sops-helm
  valueFiles:
    - ../../environments/livelihood-dev.yaml
    - ../../environments/livelihood-dev-tags.yaml
    - ../../environments/livelihood-dev-secrets.yaml

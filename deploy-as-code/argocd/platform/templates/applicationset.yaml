apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace | default "argocd" }}

spec:
  generators:
    - git:
        repoURL: {{ .Values.applicationset.repoURL | quote }}
        revision: {{ .Values.applicationset.revision | quote }}

        directories:
          - path: {{ .Values.applicationset.chartRoot | quote }}

  template:
    metadata:
      name: '{{ "{{path.basename}}" }}'

    spec:
      project: {{ .Values.name }}

      source:
        repoURL: {{ .Values.applicationset.repoURL | quote }}
        targetRevision: {{ .Values.applicationset.revision | quote }}
        path: '{{ "{{path}}" }}'

        plugin:
          name: {{ .Values.applicationset.cmpPlugin | default "sops-helm" | quote }}
          parameters:
            - name: release-name
              string: '{{ "{{path.basename}}" }}'
            - name: values-files
              array:
                {{- toYaml .Values.applicationset.valueFiles | nindent 16 }}

      destination:
        {{- if .Values.project.destination.name }}
        name: {{ .Values.project.destination.name | quote }}
        {{- else }}
        server: {{ .Values.project.destination.server | quote }}
        {{- end }}
        namespace: {{ .Values.project.destination.namespace | quote }}

      # The common Deployment/StatefulSet/CronJob templates stamp a
      # deployment-timestamp annotation from .Release.Time, which is a new
      # value on every render. Since ArgoCD re-renders the chart on every
      # refresh, that field never settles and every app shows OutOfSync
      # forever. Ignore it for diffing/sync purposes; real config/image
      # changes still show up and still sync normally.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/metadata/annotations/deployment-timestamp
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/template/metadata/annotations/deployment-timestamp
        - group: batch
          kind: CronJob
          jsonPointers:
            - /spec/jobTemplate/spec/template/metadata/annotations/deployment-timestamp

      syncPolicy:
        {{- if .Values.applicationset.syncPolicy }}
        {{- toYaml .Values.applicationset.syncPolicy | nindent 8 }}
        {{- else }}
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Validate=true
          - ServerSideApply=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        {{- end }}

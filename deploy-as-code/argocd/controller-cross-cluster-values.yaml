# Overlay for the upstream argo-helm `argo-cd` chart. Grants argocd-application-controller
# an IRSA identity so it can authenticate to dev/uat clusters via ArgoCD's native AWS auth
# (awsAuthConfig, backed by the AWS SDK) instead of a static bearer token. Merge alongside
# repo-server-cmp/values.yaml, e.g.:
#
#   helm upgrade --install argocd deploy-as-code/argocd/helm -n argocd --create-namespace \
#     -f deploy-as-code/argocd/helm/values.yaml \
#     -f deploy-as-code/argocd/repo-server-cmp/values.yaml \
#     -f deploy-as-code/argocd/controller-cross-cluster-values.yaml
#
# Authentication only (IAM identity) — authorization on the dev/uat side is a separate
# step: an EKS Access Entry mapping this role to a Kubernetes group, plus a namespace-scoped
# Role/RoleBinding for that group in `core` on each target cluster.

controller:
  serviceAccount:
    # NOTE: this role's trust policy must accept the OIDC provider of the cluster
    # hosting this ArgoCD — livelihood-prod is
    # oidc.eks.ap-south-2.amazonaws.com/id/682EFACC807F060F74BD802C688E3C1A,
    # subject system:serviceaccount:argocd:argocd-application-controller.
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::654654556600:role/livelihood-prod-cross-cluster-access"

# Registers the dev and uat EKS clusters as remote clusters so this single ArgoCD
# instance can manage all three environments. Each cluster's application-controller
# auth uses the IRSA identity above via awsAuthConfig (AWS SDK, no `aws` CLI binary
# required in the controller image) instead of a static bearer token/kubeconfig.
# The `name` used here (livelihood-dev / livelihood-uat) must match
# project.destination.name in ../platform/values-dev.yaml / values-uat.yaml.
configs:
  clusterCredentials:
    livelihood-dev:
      server: https://A0D97F1AEC33F85FBA462F16A1B68A19.yl4.ap-south-2.eks.amazonaws.com
      namespaces: core,backbone,monitoring
      config:
        awsAuthConfig:
          clusterName: livelihood-dev
        tlsClientConfig:
          insecure: false
          caData: ""
    livelihood-uat:
      server: https://058A6DA225F9F0593D9996CBA5E114AB.gr7.ap-south-2.eks.amazonaws.com
      namespaces: core,backbone,monitoring
      config:
        awsAuthConfig:
          clusterName: livelihood-uat
        tlsClientConfig:
          insecure: false
          caData: ""

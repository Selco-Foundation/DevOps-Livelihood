# Overlay for the upstream argo-helm `argo-cd` chart. This installs a
# standalone ArgoCD instance dedicated to DIGIT-DevOps (separate from the
# Livelihood hub instance — different repo-server, different CMP sidecar
# deployment, different IAM role/OIDC trust, even if it runs on the same
# EKS cluster/account). Merge it on top of whatever values file already
# installs Argo CD, e.g.:
#
#   helm upgrade --install argocd argo/argo-cd -n argocd \
#     -f <your-existing-argocd-values.yaml> \
#     -f deploy-as-code/argocd/repo-server-cmp/values.yaml
#
# It adds a "sops-helm" Config Management Plugin sidecar to argocd-repo-server
# so Applications can set `source.plugin.name: sops-helm` to have SOPS-encrypted
# Helm value files (selco-{dev,uat,prod}-secrets.yaml) decrypted at
# manifest-render time, regardless of which environment they belong to.

configs:
  cmp:
    create: true
    plugins:
      sops-helm:
        init:
          command: [sh, -c]
          args: ["helm dependency build"]

        generate:
          command: [bash, -c]
          args:
            - |
              set -euo pipefail

              release_name="${PARAM_RELEASE_NAME:-$ARGOCD_APP_NAME}"

              # Decrypt into real temp files rather than `<(sops -d "$file")`:
              # ArgoCD's CMP server execs this script through its own gRPC/exec
              # wrapper, which tears down process-substitution pipes before the
              # separately-exec'd `helm` binary can open /dev/fd/N, failing with
              # "open /dev/fd/N: no such file or directory" on every render.
              decrypted_files=()
              cleanup() { rm -f "${decrypted_files[@]:-}"; }
              trap cleanup EXIT

              values_args=()
              i=0
              while :; do
                var="PARAM_VALUES_FILES_${i}"
                file="${!var:-}"
                [ -z "$file" ] && break
                case "$(basename "$file")" in
                  *secrets*)
                    decrypted="$(mktemp)"
                    sops -d "$file" > "$decrypted"
                    decrypted_files+=("$decrypted")
                    values_args+=(-f "$decrypted")
                    ;;
                  *) values_args+=(-f "$file") ;;
                esac
                i=$((i + 1))
              done

              helm template "$release_name" . "${values_args[@]}"

repoServer:
  # Trusts the livelihood-prod EKS OIDC provider
  # (oidc.eks.ap-south-2.amazonaws.com/id/682EFACC807F060F74BD802C688E3C1A),
  # subject system:serviceaccount:argocd:argocd-repo-server. Scoped to
  # kms:Decrypt on all three env keys (see ../../charts/.sops.yaml) since one
  # repo-server renders all three envs.
  serviceAccount:
    create: true
    name: argocd-repo-server
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::654654556600:role/livelihood-prod-eks-kms-access"

  volumes:
    - name: sops-helm-plugin-config
      configMap:
        name: argocd-cmp-cm

  extraContainers:
    - name: sops-helm
      # Reuses the already-built Livelihood image (bash+helm+sops, nothing
      # project-specific) — rebuild from ./Dockerfile only if this needs to
      # diverge later.
      image: selcohub/argocd-cmp-sops-helm:0.1.0
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          value: "180s"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: sops-helm-plugin-config
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: sops-helm.yaml
        - name: tmp
          mountPath: /tmp

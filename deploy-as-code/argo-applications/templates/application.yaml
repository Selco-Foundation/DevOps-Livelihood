{{- $root := .Values -}}
{{- range .Values.apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: {{ $root.namespace | default "argocd" }}
spec:
  project: {{ $root.project | default "default" }}

  source:
    repoURL: {{ $root.repo.url }}
    targetRevision: {{ $root.repo.revision }}
    path: {{ .path }}

    {{- if or .valueFiles .valuesObject }}
    helm:
      releaseName: {{ .name }}

      {{- with .valueFiles }}
      valueFiles:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .valuesObject }}
      valuesObject:
        {{- tpl (toYaml .) $root | nindent 8 }}
      {{- end }}
    {{- end }}

  destination:
    server: https://kubernetes.default.svc
    {{- if .namespace }}
    namespace: {{ .namespace }}
    {{- end }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Validate=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

{{- end -}}

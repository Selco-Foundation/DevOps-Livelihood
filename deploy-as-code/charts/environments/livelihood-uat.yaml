global:
  domain: setu4livelihood-uat.selcofoundation.org
root-ingress:
  cert-issuer: "letsencrypt-prod"
configmaps:
  egov-config:
    data:
      db-host: "livelihood-prod-db.cv8qq86uu7ec.ap-south-2.rds.amazonaws.com" ## Add db-host name eg: egov-demo.database.azure.com
      db-name: "livelihooduatdb" ## Add db-name
      db-url: "jdbc:postgresql://livelihood-prod-db.cv8qq86uu7ec.ap-south-2.rds.amazonaws.com/livelihooduatdb"
      db-otel-url: "jdbc:otel:postgresql://livelihood-prod-db.cv8qq86uu7ec.ap-south-2.rds.amazonaws.com/livelihooduatdb"
      es-host: "elasticsearch-data.backbone"
      es-indexer-host: "https://elasticsearch-data.backbone:9200/"
      kafka-brokers: "kafka-kraft-controller-headless.backbone:9092"
      egov-services-fqdn-name: https://setu4livelihood-uat.selcofoundation.org/
      s3-assets-bucket: livelihood-uat-assets-bucket
      filestore-download-enpoint: "https://setu4livelihood-uat.selcofoundation.org/filestore/v1/files/file"
      egov-state-level-tenant-id: livelihood

egov-user:
  heap: "-Xmx384m -Xms384m -XX:+UseG1GC"
  minReplicas: 1
  maxReplicas: 2
  resources: |
    requests:
      memory: "512Mi"
      cpu: 75m
    limits:
      memory: "1024Mi"
      cpu: 300m
  otp-validation: "true"
  citizen-otp-enabled: "true"
  employee-otp-enabled: "false"
  access-token-validity: 10080
  refresh-token-validity: 20160
  default-password-expiry: 90
  mobile-number-validation: "false"
  roles-state-level: "true"
  citizen-registration-withlogin: "true"
  citizen-otp-fixed: "123456"
  citizen-otp-fixed-enabled: "true"
  egov-state-level-tenant-id: "livelihood"
  decryption-abac-enabled: "true"


livelihood-ui:
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://livelihood-dev-assets-bucket.s3.ap-south-2.amazonaws.com/unifiedglobalConfigs-dev.js type=text/javascript></script>
      ';"

digit-ui:
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://selco-assets.s3.ap-south-1.amazonaws.com/globalConfigs.js type=text/javascript></script>
      ';"

installation-qc:
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://selco-assets.s3.ap-south-1.amazonaws.com/asset-management/globalConfigs-am.js type=text/javascript></script>
      ';"   

workbench-ui:
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://selco-assets.s3.ap-south-1.amazonaws.com/workbench-ui/globalConfigs-wb.js type=text/javascript></script>
      ';"   

egov-filestore:
  heap: "-Xmx512m -Xms512m -XX:+UseG1GC -XX:G1PeriodicGCInterval=30000"
  memory_requests: "768Mi"
  memory_limits: "1024Mi"
  minReplicas: 1
  maxReplicas: 2
  volume: /opt/eGov/filestore
  is-bucket-fixed: "true"
  minio.url : "http://minio.backbone:9000/"
  aws.s3.url : "https://s3.amazonaws.com"
  is-s3-enabled: "true"
  minio-enabled: false
  allowed-file-formats-map: '{json:{''application/json'',''text/plain'',''application/geo+json''},jpg:{''image/jpg'',''image/jpeg''},jpeg:{''image/jpeg'',''image/jpg''},png:{''image/png''},pdf:{''application/pdf''},odt:{''application/vnd.oasis.opendocument.text''},ods:{''application/vnd.oasis.opendocument.spreadsheet''},docx:{''application/x-tika-msoffice'',''application/x-tika-ooxml'',''application/vnd.oasis.opendocument.text'',''application/msword'',''application/vnd.openxmlformats-officedocument.wordprocessingml.document''},doc:{''application/x-tika-msoffice'',''application/x-tika-ooxml'',''application/vnd.oasis.opendocument.text'',''application/msword''},dxf:{''text/plain'',''application/dxf'',''application/octet-stream'',''image/vnd.dxf'',''image/vnd.dxf;format=ascii'',''image/vnd.dxf;format=binary'',''image/vnd.dxb''},csv:{''text/plain'',''text/csv'',''application/zip''},txt:{''text/plain''},xlsx:{''application/x-tika-ooxml'',''application/x-tika-msoffice'',''application/vnd.ms-excel'',''application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'',''application/zip''},xls:{''application/x-tika-ooxml'',''application/x-tika-msoffice'',''application/vnd.ms-excel''},mp4:{"video/mp4", "video/quicktime"},mp3:{"audio/mpeg"},avi:{"video/x-msvideo"},mov:{"video/quicktime"}, wmv:{"video/x-ms-wmv"},m3u8:{"application/vnd.apple.mpegurl","application/x-mpegURL"},ts:{"video/MP2T","video/mp2t", "application/octet-stream"}}'
  allowed-file-formats: "jpg,jpeg,png,doc,docx,pdf,odt,ods,text,dxf,xls,xlsx"
  filestore-url-validity: 3600
  fixed-bucketname: livelihood-uat-filestore-bucket  ## Add filestore bucket name


egov-idgen:
  memory_requests: "384Mi"
  idformat-from-mdms: "true"
  java-args: -Dspring.profiles.active=monitoring
  autocreate-new-seq: "true"


egov-notification-sms:
  memory_requests: "384Mi"
  sms-provider-url: "https://restapi.smscountry.com/v0.1/Accounts/A2mCONOT0pIjJ12fuKC8/SMSes/" ## Add sms provider url
  sms.provider.class: "Generic"
  sms.provider.contentType:  "application/json"
  sms-config-map: "{'Text':'$message', 'Number': '$mobileno', 'SenderId':'$senderid', 'DRNotifyUrl':'https://www.domainname.com/notifyurl', 'DRNotifyHttpMethod':'POST', 'Tool':'API'}"
  sms-gateway-to-use: "sms provider name" ## Add sms provider name
  sms-sender: "SELCO" ## Add sms sender
  sms-sender-requesttype: "POST"
  sms.verify.responseContains: "Success"
  sms-custom-config: "true"
  sms-extra-req-params: "mtype=N&DR=Y"
  sms-sender-req-param-name: "sid"
  sms-sender-username-req-param-name: "User"
  sms-sender-password-req-param-name: "passwd"
  sms-destination-mobile-req-param-name: "mobilenumber"
  sms-message-req-param-name: "message"
  sms-error-codes: "401,403,404,405,406,407,408,409,410,411,412,413,414"

egov-mdms-service:
  memory_requests: "768Mi"
  memory_limits: 1024Mi
  mdms-path: "/work-dir/egov-mdms-data/data"
  mdms-folder: "selco-mdms-data"
  masters-config-url: "file:///work-dir/egov-mdms-data/master-config.json"
  java-args: -Dspring.profiles.active=monitoring

egov-indexer:
  heap: "-Xmx512m -Xms512m"
  initContainers:
    gitSync:
      repo: "git@github.com:Selco-Foundation/Configs-Livelihood"        ##### Change repo url with Your fork Repo url
      branch: "uat_dev"                                         ##### Change repo branch with Your fork Repo branch
      rev: 86a5acceec6067d1db0fd1547e5338fef4a7a87f
  egov-indexer-yaml-repo-path: "file:///work-dir/Configs-Livelihood/egov-indexer/project-indexer.yml,file:///work-dir/Configs-Livelihood/egov-indexer/im-services.yml,file:///work-dir/Configs-Livelihood/egov-indexer/egov-url-shortening-indexer.yaml,file:///work-dir/Configs-Livelihood/egov-indexer/individual-indexer.yml,file:///work-dir/Configs-Livelihood/egov-indexer/escalation-status-indexer.yml"

egov-persister:
  heap: "-Xmx256m -Xms256m"
  memory_requests: "512Mi"
  memory_limits: "768Mi"
  persist-yml-path: "file:///work-dir/Configs-Livelihood/health/egov-persister/facility-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/field-plan-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/activity-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/project-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/egov-user-event-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/egov-workflow-v2-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/im-services-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/hrms-employee-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/mdms-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/audit-service-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/privacy-audit.yml,file:///work-dir/Configs-Livelihood/egov-persister/boundary-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/asset-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/vendor-persister.yaml"
  initContainers:
    gitSync:
      repo: "git@github.com:Selco-Foundation/Configs-Livelihood"      ##### Change repo url with Your fork Repo url
      branch: "uat_dev"
      rev: bc1f25340daa69b4dd95577cbecb5c8a4615be78

pdf-service:
  initContainers:
    gitSync:
      repo: "git@github.com:Selco-Foundation/Configs-Livelihood"
      branch: "uat_dev"
      rev: 86a5acceec6067d1db0fd1547e5338fef4a7a87f

audit-service:
  memory_requests: "256Mi"
  memory_limits: "512Mi"
  persist-yml-path: "file:///work-dir/Configs-Livelihood/egov-persister/im-services-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/egov-workflow-v2-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/hrms-employee-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/boundary-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/asset-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/vendor-persister.yaml,file:///work-dir/Configs-Livelihood/egov-persister/mdms-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/egov-user-event-persister.yml,file:///work-dir/Configs-Livelihood/egov-persister/privacy-audit.yml"
  initContainers:
    gitSync:
      repo: "git@github.com:Selco-Foundation/Configs-Livelihood"
      branch: "uat_dev"


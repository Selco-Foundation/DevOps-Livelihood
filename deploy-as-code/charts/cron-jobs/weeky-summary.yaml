apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-summary
  namespace: core
spec:
  schedule: 0 9 * * 1
  timeZone: Asia/Kolkata
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: weekly-summary
            image: selcohub/livelihood-weekly-summary:staging-20-july-2026
          restartPolicy: OnFailure

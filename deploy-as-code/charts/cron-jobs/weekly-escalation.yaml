apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-escalation
  namespace: core
spec:
  schedule: 30 9 * * 1    # every monday
  timeZone: Asia/Kolkata
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: weekly-escalation
            image: selcohub/livelihood-cronjob-weekly-escalation:prod-20261005
          restartPolicy: OnFailure

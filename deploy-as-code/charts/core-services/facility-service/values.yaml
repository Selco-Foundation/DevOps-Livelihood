# Common Labels
labels:
  app: "facility-service"
  group: "core"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "facility_registry_schema"
    image:
      repository: "selcohub/facility-registry-db"
      tag: develop-c2d550845143a72be8dfa120527a5678979c19c5

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "facility-service"

# Container Configs
image:
  repository: "selcohub/facility-registry"
  tag: develop-c2d550845143a72be8dfa120527a5678979c19c5
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/facility-service/health"
  readinessProbePath: "/facility-service/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"
memory_limits: "1536Mi"
memory_requests: "1Gi"

persistence:
  enabled: false

# Additional Container Envs
env: |
  - name: EGOV_VENDOR_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: vendor-registry
  - name: EGOV_IM_SERVICES_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: im-services
  - name: EGOV_INDEXER_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: elasticsearch-credentials
  - name: EGOV_INDEXER_ES_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: elasticsearch-credentials
  - name: EGOV_INDEXER_ES_HOST_NAME
    value: https://elasticsearch-data.backbone-dev
  - name: EGOV_ENC_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-enc-service
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /facility-service
  - name: SERVER_CONTEXT_PATH
    value: /facility-service  
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_LOCALIZATION_SEARCH_ENDPOINT
    value: /localization/messages/v1/_search
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_MDMS_PORT
    value: "8080"
  - name: EGOV_HRMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-hrms
  - name: WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-workflow-v2
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-service
  - name: OTEL_SERVICE_NAME
    value: facility-service
  - name: OTEL_EXPORTER_ENDPOINT 
    value: "http://jaeger-tracing-collector.backbone-dev:4318" 
  - name: OTEL INSTRUMENTATION_HTTP_SERVER_IGNORE_URLS
    value: "/facility-service/health,/facility-service/prometheus"



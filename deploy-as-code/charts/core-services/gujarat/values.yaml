# Common Labels
labels:
  app: "gujarat"
  group: "web"

# Ingress Configs
ingress:
  enabled: true
  context: "gujarat"
  # Redirect /gujarat/* to /digit-ui/* with all query params preserved
  redirect:
    enabled: true
    target: "digit-ui"
    serviceName: "digit-ui"
    servicePort: 80

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "selcohub/gujarat-ui"
  tag: multi-tenant-image-test-208afca1b9bfcd76e6be3891abfb0a522d43e34a
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/gujarat/"
  readinessProbePath: "/gujarat/"

env: |
  - name: PUBLIC_PATH
    value: /gujarat

    
extraVolumes: |
  - name: js-injection
    configMap:
      name: gujarat

extraVolumeMounts: |
  - mountPath: /etc/nginx/conf.d/sub_filter.conf
    name: js-injection
    subPath: sub_filter.conf

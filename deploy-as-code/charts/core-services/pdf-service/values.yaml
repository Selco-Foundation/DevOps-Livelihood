# Common Labels
labels:
  app: "pdf-service"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "pdf-service"

initContainers:
  gitSync:
    enabled: true
    repo: "git@github.com:Selco-Foundation/configs.git"
    branch: "main"
  extraInitContainers: |
    - name: wait-for-kafka
      image: docker.io/selcohub/kafka:3.6.0-debian-11-r0   # reuse the image already in your registry, no new pull
      env:
        - name: KAFKA_BOOTSTRAP
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: kafka-brokers        # same value pdf-service itself uses — no drift between check and app
      command:
        - /bin/bash
        - -ec
        - |
          echo "Waiting for Kafka to serve metadata at $KAFKA_BOOTSTRAP ..."
          timeout_seconds=180
          elapsed=0
          until kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" --list >/dev/null 2>&1; do
            elapsed=$((elapsed + 5))
            if [ "$elapsed" -ge "$timeout_seconds" ]; then
              echo "Kafka did not become ready within ${timeout_seconds}s, giving up."
              exit 1
            fi
            echo "Kafka not ready yet ($elapsed s)..."
            sleep 5
          done
          echo "Kafka topic metadata is reachable."

# Container Configs
image:
  repository: "egovio/pdf-service"
  tag: pdf-2.9-lts-a17e8ebea8-48
replicas: "1"
healthChecks:
  enabled: false
  livenessProbePath: "/pdf-service/health"
  readinessProbePath: "/pdf-service/health"
data-config-urls: "file:///work-dir/Configs-Livelihood/pdf-service/data-config/bom_ac_off_single.json,file:///work-dir/Configs-Livelihood/pdf-service/data-config/bom_ac_off_three.json,file:///work-dir/Configs-Livelihood/pdf-service/data-config/bom_dc_system.json,file:///work-dir/Configs-Livelihood/pdf-service/data-config/bom_hybrid_single.json,file:///work-dir/Configs-Livelihood/pdf-service/data-config/bom_hybrid_three.json,file:///work-dir/Configs-Livelihood/pdf-service/data-config/amc-report.json"
format-config-urls: "file:///work-dir/Configs-Livelihood/pdf-service/format-config/bom_ac_off_single.json,file:///work-dir/Configs-Livelihood/pdf-service/format-config/bom_ac_off_three.json,file:///work-dir/Configs-Livelihood/pdf-service/format-config/bom_dc_system.json,file:///work-dir/Configs-Livelihood/pdf-service/format-config/bom_hybrid_single.json,file:///work-dir/Configs-Livelihood/pdf-service/format-config/bom_hybrid_three.json,file:///work-dir/Configs-Livelihood/pdf-service/format-config/amc-report.json"

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: EGOV_LOCALISATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_FILESTORE_SERVICE_HOST
    value: http://egov-filestore.core:8080
  - name: EGOV_LOCALISATION_SEARCH
    value: localization/messages/v2/_search
  - name: KAFKA_CREATE_JOB_TOPIC
    value: PDF_GEN_CREATE
  - name: KAFKA_RECEIVE_CREATE_JOB_TOPIC
    value: PDF_GEN_RECEIVE
  - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  - name: KAFKA_BROKER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: DB_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-host
  - name: DB_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
  - name: DEFAULT_LOCALISATION_TENANT
    value: "pg"
  - name: STATE_LEVEL_TENANT_ID
    value: "pg"
  - name: DATA_CONFIG_URLS
    value: {{ index .Values "data-config-urls" | quote }}
  - name: FORMAT_CONFIG_URLS
    value: {{ index .Values "format-config-urls" | quote }}
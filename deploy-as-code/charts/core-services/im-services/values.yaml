# Common Labels
labels:
  app: "im-services"
  group: "rainmaker"

namespace: core

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "im-services"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 250m


# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "im_service_schema"
    image:
      repository: "selcohub/im-services-db"
      tag: "main-87dbaeea5af057c243a85e625dc8f5ee3f434681"
    env: |
      - name: EGOV_USER_HOST
        valueFrom:
          configMapKeyRef:
            name: egov-service-host
            key: egov-user
      - name: EGOV_LOCALIZATION_HOST
        valueFrom:
          configMapKeyRef:
            key: egov-localization
            name: egov-service-host
      - name: EGOV_BOUNDARY_HOST
        valueFrom:
          configMapKeyRef:
            name: egov-service-host
            key: boundary-service
      - name: EGOV_FACILITY_HOST
        valueFrom:
          configMapKeyRef:
            name: egov-service-host
            key: facility-service
      - name: EGOV_HRMS_HOST
        valueFrom:
          configMapKeyRef:
            key: egov-hrms
            name: egov-service-host
      - name: EGOV_ES_HOST
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: es-indexer-host
      - name: EGOV_ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: elasticsearch-credentials
            key: password
      - name: EGOV_ES_USERNAME
        valueFrom:
          secretKeyRef:
            name: elasticsearch-credentials
            key: username
      - name: EGOV_WORKFLOW_HOST
        valueFrom:
          configMapKeyRef:
            key: egov-workflow-v2
            name: egov-service-host
      - name: DB_URL
        valueFrom:
          configMapKeyRef:
            key: db-url
            name: egov-config
      - name: SCHEMA_TABLE
        value: im_service_schema
      - name: FLYWAY_USER
        valueFrom:
          secretKeyRef:
            key: flyway-username
            name: db
      - name: FLYWAY_PASSWORD
        valueFrom:
          secretKeyRef:
            key: flyway-password
            name: db
      - name: FLYWAY_LOCATIONS
        valueFrom: 
          configMapKeyRef: 
              key: flyway-locations
              name: egov-config
      - name: EGOV_MDMS_HOST
        valueFrom:
          configMapKeyRef:
            key: egov-mdms-service
            name: egov-service-host

# Container Configs
image:
  repository: "selcohub/im-services"
  tag: "main-87dbaeea5af057c243a85e625dc8f5ee3f434681"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/im-services/health"
  readinessProbePath: "/im-services/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx2900m -Xms2900m"
memory_requests: "2Gi"
memory_limits: "4Gi"
minReplicas: 2

lifecycle:
  postStart:
    exec:
      command:
        - sh
        - -c
        - |
          set -e
          apk add --no-cache ffmpeg cpulimit
          ln -s /usr/bin/ffprobe /usr/local/bin/ffprobe   ##Symbolic link at different directory
          ln -s /usr/bin/ffmpeg /usr/local/bin/ffmpeg

nodeSelector:
  accelerator: none
tolerations:
  - effect: NoSchedule
    key: cpu
    operator: Equal
    value: "true"

# Additional Container Envs
env: |
  - name: EGOV_ASSET_HOST
    valueFrom:
      configMapKeyRef:
        key: asset-registry
        name: egov-service-host
  - name: EGOV_VENDOR_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: vendor-registry
  - name: EGOV_FACILITY_HOST
    valueFrom:
      configMapKeyRef:
        key: facility-service
        name: egov-service-host
  - name: EGOV_RMS_HOST
    valueFrom:
     configMapKeyRef:
        key: rms-service
        name: egov-service-host
  - name: EGOV_RMS_TICKET_STATUS_UPDATE_PATH
    value: /rms-service/v1/ticket/status/update
  - name: EGOV_FACILITY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: facility-service
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-service
  - name: SPRING_FLYWAY_ENABLED
    value: "false"
  - name: SERVER_CONTEXT_PATH
    value: /im-services
  - name: FFMPEG_CPULIMITPERCENTAGE
    value: "100"
  - name: SPRING_SERVLET_MULTIPART_ENABLED
    value: "true"
  - name: SPRING_SERVLET_MULTIPART_LOCATION
    value: "/opt/egov/input"
  - name: SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE
    value: "100MB"
  - name: SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE
    value: "500MB"
  - name: FFPROBE_PATH
    value: "/usr/local/bin/ffprobe"
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-mdms-service
        name: egov-service-host
  - name: SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE
    value: 100MB
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-user
        name: egov-service-host
  - name: EGOV_LOCATION_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-location
        name: egov-service-host
  - name: EGOV_FILESTORE_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-filestore
        name: egov-service-host
  - name: EGOV_FILESTORE_UPLOAD_ENDPOINT
    value: /filestore/v1/files
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-localization
        name: egov-service-host
  - name: EGOV_WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-workflow-v2
        name: egov-service-host
  - name: EGOV_URL_SHORTNER_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-url-shortening
        name: egov-service-host
  - name: EGOV_URL_SHORTNER_ENDPOINT
    value: /eus/shortener
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-idgen
        name: egov-service-host
  - name: EGOV_IDGEN_PATH
    value: egov-idgen/id/_generate
  - name: WORKFLOW_CONTEXT_PATH
    value: egov-workflow-v2/egov-wf/businessservice/_search
  - name: MSEVA_MOBILE_APP_DOWNLOAD_LINK
    value: https://bit.ly/466SBpv
  - name: EGOV_HRMS_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-hrms
        name: egov-service-host
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: egov-im-services
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.springframework.kafka.support.serializer.JsonSerializer
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: -Dspring.profiles.active=monitoring
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_FILESTORE_DOWNLOAD_ENDPOINT
    valueFrom:
      configMapKeyRef: 
        key: filestore-download-enpoint
        name: egov-config

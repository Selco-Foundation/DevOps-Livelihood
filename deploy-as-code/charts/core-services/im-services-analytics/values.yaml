# Common Labels
labels:
  app: "im-services-analytics"
  group: "core"

namespace: core

# Ingress Configs
ingress:
  enabled: false
  zuul: true
  context: "im-services-analytics"

# Container Configs
image:
  repository: "selcohub/im-services-analytics"
  tag: "im-services-analytics-27624fe645-11"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/im-services-analytics/health"
  readinessProbePath: "/im-services-analytics/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx1560m -Xms1560m"
memory_limits: "2560Mi"
memory_requests: "2Gi"
minReplicas: 2

# Additional Container Envs
env: |
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_RMS_HOST
    valueFrom:
     configMapKeyRef:
        key: rms-service
        name: egov-service-host
  - name: EGOV_FACILITY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: facility-service
  - name: EGOV_PROJECT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: project
  - name: EGOV_HRMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-hrms
  - name: EGOV_WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        key: egov-workflow-v2
        name: egov-service-host
  - name: EGOV_INFRA_INDEXER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: es-indexer-host
  {{- if index .Values "global" "serializers-timezone-in-ist" }}
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.egov.tracer.kafka.serializer.ISTTimeZoneJsonSerializer
  {{- end }}
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_STATELEVEL_TENANTID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id
  - name: EGOV_INDEXER_ES_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: username
  - name: EGOV_INDEXER_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-credentials
        key: password
  - name: KAFKA_TOPICS_CONSUMER
    value: "save-hrms-employee"
  - name: EGOV_UPDATE_INDEX_PATH
    value: "phc-master-list/_update/"
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: /egov-mdms-service/v1/_search
  - name: EGOV_INDEXER_ES_HOST_NAME
    value: https://elasticsearch-data.backbone
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_FILESTORE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-filestore
  - name: SAURA_EMITRA_BASE_URL
    value: https://saura-emitra.selcofoundation.org
  - name: EGOV_FILESTORE_BASEURL
    value: https://saura-emitra.selcofoundation.org
  - name: KIBANA_DASHBOARD_URL
    value: https://saura-emitra.selcofoundation.org/kibana

